services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: finbot
      POSTGRES_PASSWORD: finbot
      POSTGRES_DB: finbot
    ports:
      - "5432:5432"
    volumes:
      - finbot_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbot -d finbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - finbot
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-ttl
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "finbot", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgres://finbot:finbot@postgres:5432/finbot?sslmode=disable
      REDIS_URL: redis://:finbot@redis:6379/0
      BOT_TTL: ${BOT_TTL:-1h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRIAL_DURATION: ${TRIAL_DURATION:-168h}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-USD}

volumes:
  finbot_postgres:
