services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: finbot
      POSTGRES_PASSWORD: finbot
      POSTGRES_DB: finbot
    ports:
      - "5432:5432"
    volumes:
      - finbot_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbot -d finbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - finbot
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-ttl
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "finbot", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finbot_postgres:
