name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    name: "unit:test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: make test-unit

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --config=.golangci.yaml

  integration-test:
    name: "integration:test"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finbot
          POSTGRES_PASSWORD: finbot
          POSTGRES_DB: finbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finbot -d finbot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        command: >-
          redis-server --requirepass finbot --maxmemory 64mb --maxmemory-policy volatile-ttl
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a finbot ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_URL: postgres://finbot:finbot@127.0.0.1:5432/finbot_test?sslmode=disable
      REDIS_TEST_URL: redis://:finbot@127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration tests
        run: make test-integration

  common:
    name: common
    if: always()
    needs: [unit-test, lint, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require all common jobs
        run: |
          test "${{ needs.unit-test.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.integration-test.result }}" = "success"

  deploy:
    name: deploy
    needs: common
    # GitHub forbids `secrets` in job-level `if` (invalidates the whole workflow).
    # Empty token/service id fails this job instead of skipping.
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
    steps:
      - name: Require Railway secrets
        run: |
          test -n "${RAILWAY_TOKEN}"
          test -n "${RAILWAY_SERVICE_ID}"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy
        run: |
          extra=()
          if [ -n "${RAILWAY_PROJECT_ID}" ]; then
            extra+=(--project "${RAILWAY_PROJECT_ID}")
          fi
          if [ -n "${RAILWAY_ENVIRONMENT}" ]; then
            extra+=(--environment "${RAILWAY_ENVIRONMENT}")
          fi
          railway up --ci --service "${RAILWAY_SERVICE_ID}" "${extra[@]}"
