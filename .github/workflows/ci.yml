name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    name: "unit:test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: make test-unit

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --config=.golangci.yaml

  integration-test:
    name: "integration:test"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finbot
          POSTGRES_PASSWORD: finbot
          POSTGRES_DB: finbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finbot -d finbot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_URL: postgres://finbot:finbot@127.0.0.1:5432/finbot_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration tests
        run: make test-integration

  common:
    name: common
    if: always()
    needs: [unit-test, lint, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require all common jobs
        run: |
          test "${{ needs.unit-test.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.integration-test.result }}" = "success"
